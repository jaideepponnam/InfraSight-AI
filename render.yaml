services:
  - type: web
    name: infrasight-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-sync python -m uvicorn infrasight.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health/ready
    domains:
      - api.jaideepponnam.com
    envVars:
      - key: APP_ENV
        value: production
      - key: UV_VERSION
        value: 0.13.0
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: API_READ_KEY
        sync: false
      - key: API_ADMIN_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://jaideepponnam.com"]'
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "10000"
      - key: HOST_ENABLED
        value: "false"
      # Enable only after a separately approved schema migration and release.
      - key: SRE_ENABLED
        value: "false"
      - key: SRE_RUN_DEADLINE_SECONDS
        value: "120"
      - key: SRE_COOLDOWN_SECONDS
        value: "60"
  - type: web
    name: infrasight-frontend
    runtime: static
    branch: main
    rootDir: frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - jaideepponnam.com
    envVars:
      - key: NODE_VERSION
        value: 22.15.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://api.jaideepponnam.com
      - key: VITE_API_READ_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
